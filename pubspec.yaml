name: fin_pessoal
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.30.0
  drift_flutter: ^0.2.8
  flutter_riverpod: ^2.6.1
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.30.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

# Generate app icons (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: assets/icon/app_icon.png
